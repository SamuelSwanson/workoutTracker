<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DG ATHLETE — 32-Week Training System</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0c0f;--surface:#111418;--surface2:#181c22;--border:#252a33;
    --accent:#c8f73a;--accent2:#3af7c8;--accent3:#f7823a;--accent4:#7a3af7;
    --text:#e8eaf0;--muted:#606880;--red:#f74a3a;--yellow:#f7d23a;
    --cardio:#3a9ef7;--yoga:#3af7c8;--dg:#c8f73a;--lift:#f7823a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}

  /* ── HEADER ── */
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;background:rgba(10,12,15,0.97);backdrop-filter:blur(10px);gap:12px}
  .logo{font-family:'Bebas Neue',cursive;font-size:1.7rem;letter-spacing:.1em;color:var(--accent);line-height:1;flex-shrink:0}
  .logo span{color:var(--text);font-size:.7rem;display:block;letter-spacing:.25em;opacity:.5}
  .header-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .stat-pill{background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:5px 12px;font-family:'DM Mono',monospace;font-size:.7rem;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .stat-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
  .stat-pill .dot.r{background:var(--accent3)}

  /* ── PHASE NAV ── */
  .phase-nav{display:flex;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .phase-tab{padding:11px 20px;font-family:'DM Mono',monospace;font-size:.75rem;letter-spacing:.08em;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;opacity:.5;text-transform:uppercase;user-select:none;white-space:nowrap;flex-shrink:0}
  .phase-tab.active{opacity:1;border-bottom-color:var(--accent);color:var(--accent)}
  .phase-tab:hover{opacity:.8}

  /* ── WEEK GRID ── */
  .week-grid-wrap{padding:16px 20px}
  .section-label{font-family:'DM Mono',monospace;font-size:.63rem;letter-spacing:.18em;opacity:.4;text-transform:uppercase;margin-bottom:10px}
  .week-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:8px}
  .week-btn{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:9px 4px;cursor:pointer;transition:.2s;text-align:center;position:relative;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
  .week-btn:active{transform:scale(.96)}
  .week-btn.active{border-color:var(--accent);background:rgba(200,247,58,.08)}
  .week-btn.completed{border-color:var(--accent2);background:rgba(58,247,200,.05)}
  .week-btn.deload{border-style:dashed;border-color:rgba(247,210,58,.4)}
  .week-btn .wnum{font-family:'Bebas Neue',cursive;font-size:1.15rem;color:var(--accent);line-height:1}
  .week-btn.deload .wnum{color:var(--yellow)}
  .week-btn.completed .wnum{color:var(--accent2)}
  .week-btn .wlabel{font-size:.48rem;font-family:'DM Mono',monospace;opacity:.4;letter-spacing:.02em;margin-top:1px}
  .week-btn .prog-bar{position:absolute;bottom:0;left:0;height:3px;background:var(--accent);transition:.4s}
  .week-btn.completed .prog-bar{background:var(--accent2)}
  .week-btn .check{position:absolute;top:4px;right:4px;width:12px;height:12px;background:var(--accent2);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:.45rem;color:#000}
  .week-btn.completed .check{display:flex}

  /* ── LEGEND ── */
  .legend{display:flex;gap:10px;padding:0 20px 14px;flex-wrap:wrap}
  .leg-item{display:flex;align-items:center;gap:5px;font-size:.63rem;font-family:'DM Mono',monospace;opacity:.6}
  .leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

  /* ── CONTENT ── */
  .content-area{padding:0 20px 80px}
  .week-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
  .week-title{font-family:'Bebas Neue',cursive;font-size:2.8rem;line-height:1;color:var(--text)}
  .week-title span{color:var(--accent)}
  .week-meta{text-align:right}
  .block-badge{display:inline-block;background:var(--accent);color:#000;font-family:'DM Mono',monospace;font-size:.65rem;font-weight:600;padding:4px 11px;border-radius:4px;letter-spacing:.1em;margin-bottom:4px}
  .block-badge.b{background:var(--accent2)}
  .block-badge.c{background:var(--accent3)}
  .block-badge.d{background:var(--accent4);color:#fff}
  .block-badge.deload{background:var(--yellow);color:#000}
  .week-focus{font-size:.75rem;opacity:.55;font-family:'DM Mono',monospace}

  /* ── PROGRESS BANNER ── */
  .prog-banner{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:.8rem;line-height:1.65;color:var(--text);opacity:.9}
  .prog-banner.deload-banner{border-left-color:var(--yellow)}
  .prog-banner strong{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:5px}
  .prog-banner.deload-banner strong{color:var(--yellow)}

  /* ── DAY GRID ── */
  .days-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

  /* ── DAY CARD ── */
  .day-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:.2s}
  .day-card.rest{opacity:.55}
  .day-header{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:8px}
  .day-name{font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:.05em;flex-shrink:0}
  .day-tag{font-family:'DM Mono',monospace;font-size:.58rem;padding:3px 8px;border-radius:100px;letter-spacing:.03em;text-align:right}
  .tag-lower{background:rgba(247,130,58,.15);color:var(--lift);border:1px solid rgba(247,130,58,.3)}
  .tag-upper{background:rgba(122,58,247,.15);color:#b07af7;border:1px solid rgba(122,58,247,.3)}
  .tag-recovery{background:rgba(58,247,200,.15);color:var(--accent2);border:1px solid rgba(58,247,200,.3)}
  .tag-explosive{background:rgba(247,58,58,.15);color:var(--red);border:1px solid rgba(247,58,58,.3)}
  .tag-pull{background:rgba(58,158,247,.15);color:var(--cardio);border:1px solid rgba(58,158,247,.3)}
  .tag-circuit{background:rgba(247,210,58,.15);color:var(--yellow);border:1px solid rgba(247,210,58,.3)}
  .tag-rest{background:rgba(96,104,128,.15);color:var(--muted);border:1px solid rgba(96,104,128,.3)}
  .day-body{padding:12px 14px}
  .segment{margin-bottom:11px}
  .seg-label{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:5px;opacity:.75}
  .seg-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .seg-dot.cardio{background:var(--cardio)}
  .seg-dot.yoga{background:var(--yoga)}
  .seg-dot.dg{background:var(--dg)}
  .seg-dot.lift{background:var(--lift)}

  /* ── EXERCISE LIST ── */
  .exercise-list{list-style:none;display:flex;flex-direction:column;gap:3px}
  .exercise-list li{display:flex;align-items:flex-start;font-size:.76rem;padding:7px 8px;border-radius:6px;background:var(--surface2);gap:8px;min-height:36px}
  .ex-name{color:var(--text);flex:1;min-width:0;line-height:1.4;word-break:break-word}
  .ex-sets{font-family:'DM Mono',monospace;font-size:.63rem;color:var(--muted);flex-shrink:0;text-align:right;padding-top:1px;max-width:90px;word-break:break-word;line-height:1.35}
  /* Big touch targets for checkboxes */
  .ex-check{width:24px;height:24px;min-width:24px;border-radius:5px;border:1px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.6rem;transition:.15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .ex-check.done{background:var(--accent);border-color:var(--accent);color:#000}

  /* ── DAY COMPLETE BTN ── */
  .day-complete-btn{width:100%;margin-top:10px;padding:12px 8px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.1em;cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .day-complete-btn:active{opacity:.7}
  .day-complete-btn.done{background:rgba(58,247,200,.08);border-color:var(--accent2);color:var(--accent2)}

  /* ── NOTES ── */
  .notes-area{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
  .notes-label{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;opacity:.45;margin-bottom:8px}
  .notes-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;resize:vertical;min-height:76px;-webkit-appearance:none}
  .notes-input:focus{outline:none;border-color:var(--accent)}

  /* ── TOAST ── */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--accent);color:#000;font-family:'DM Mono',monospace;font-size:.78rem;padding:11px 20px;border-radius:8px;opacity:0;transition:.3s;z-index:999;font-weight:600;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  /* ================================================================
     RESPONSIVE BREAKPOINTS
  ================================================================ */

  /* Tablet: 2-col days */
  @media(max-width:900px){
    .days-grid{grid-template-columns:1fr 1fr}
  }

  /* Large phone: tighter everything */
  @media(max-width:600px){
    header{padding:12px 16px}
    .logo{font-size:1.5rem}
    .logo span{font-size:.62rem;letter-spacing:.15em}
    .stat-pill{font-size:.65rem;padding:4px 10px}
    .phase-nav{padding:0 16px}
    .week-grid-wrap{padding:14px 16px}
    .legend{padding:0 16px 12px;gap:8px}
    .leg-item{font-size:.6rem}
    .content-area{padding:0 16px 80px}
    .week-grid{grid-template-columns:repeat(8,1fr);gap:4px}
    .week-btn{padding:7px 2px}
    .week-btn .wnum{font-size:1rem}
    .week-btn .wlabel{display:none}
    .week-title{font-size:2.2rem}
    .days-grid{grid-template-columns:1fr;gap:10px}
    .day-tag{font-size:.55rem;padding:2px 7px}
    .exercise-list li{font-size:.74rem}
  }

  /* Small phone: single col, max comfort */
  @media(max-width:400px){
    header{flex-direction:column;align-items:flex-start;gap:8px}
    .header-stats{width:100%;justify-content:flex-start}
    .week-grid{grid-template-columns:repeat(8,1fr);gap:3px}
    .week-btn .wnum{font-size:.9rem}
    .week-title{font-size:1.9rem}
    .prog-banner{font-size:.76rem}
    .ex-sets{max-width:75px;font-size:.6rem}
  }
</style>
</head>
<body>
<header>
  <div class="logo">DG ATHLETE<span>32-WEEK TRAINING SYSTEM v2</span></div>
  <div class="header-stats">
    <div class="stat-pill"><span class="dot"></span><span id="weeksDone">0</span>&nbsp;/ 32 WEEKS</div>
    <div class="stat-pill"><span class="dot r"></span><span id="daysDone">0</span>&nbsp;DAYS LOGGED</div>
  </div>
</header>
<div class="phase-nav">
  <div class="phase-tab active" onclick="setPhase(0)">PHASE 1 — WKS 1–16</div>
  <div class="phase-tab" onclick="setPhase(1)">PHASE 2 — WKS 17–32</div>
</div>
<div class="week-grid-wrap">
  <div class="section-label">SELECT WEEK — dashed border = deload week</div>
  <div class="week-grid" id="weekGrid"></div>
</div>
<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:var(--cardio)"></div>CARDIO</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--yoga)"></div>YOGA/STRETCH</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--dg)"></div>DISC GOLF</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--lift)"></div>LIFTING</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--yellow)"></div>DELOAD</div>
</div>
<div class="content-area" id="contentArea"></div>
<div class="toast" id="toast"></div>

<script>
// ================================================================
//  CONSTANTS
// ================================================================
const DELOAD_WEEKS = new Set([4,8,12,16,20,24,28,32]);

function blockWeek(w){ const wk=w>16?w-16:w; return((wk-1)%4)+1; }
function getBlock(w){ const wk=w>16?w-16:w; if(wk<=4)return'A';if(wk<=8)return'B';if(wk<=12)return'C';return'D'; }
function isPhase2(w){ return w>16; }
function getBlockLabel(w){
  const b=getBlock(w),p2=isPhase2(w),dl=DELOAD_WEEKS.has(w);
  const map={A:{label:'BLOCK A',sub:'Control & Foundation'},B:{label:'BLOCK B',sub:'Speed & Power'},C:{label:'BLOCK C',sub:'Strength Heavy'},D:{label:'BLOCK D',sub:'Integration & Peak'}};
  const clsMap={A:'',B:'b',C:'c',D:'d'};
  return{ label:(p2?'P2 ':'')+(dl?'DELOAD':map[b].label), sub:dl?'Recovery — 60% volume, no PR attempts':map[b].sub+(p2?' — Phase 2 Elevated':''), cls:dl?'deload':clsMap[b], isDeload:dl };
}

// ================================================================
//  PROGRESSIVE OVERLOAD ENGINE
//  bw=block week 1-4, blk=A/B/C/D, p2=bool, dl=deload
// ================================================================
function P(baseSets, baseReps, note, bw, blk, p2, dl){
  if(dl) return `${Math.max(2,baseSets-2)}×${baseReps} @ 60%`;
  let s=baseSets, r=baseReps, tag='';
  // Volume ramp: wk1 base, wk2 +1set, wk3 +2sets (PR week)
  if(bw===2) s=baseSets+1;
  if(bw===3) s=baseSets+2;
  // Block intensity modifiers
  if(blk==='B') tag=' — bar speed';
  if(blk==='C'){ s=Math.max(3,baseSets+1); r=Math.max(2,baseReps-2); tag=' — heavy'; }
  if(blk==='D') tag=' — game speed';
  // Phase 2 extra set on peak week
  if(p2&&bw===3) s=s+1;
  const noteStr=note?` (${note})`:'';
  return `${s}×${r}${tag}${noteStr}`;
}

function CT(base, bw, blk, p2, dl){
  if(dl) return `${base} min easy`;
  let t=base;
  if(bw>=2) t+=5;
  if(bw===3) t+=5;
  if(p2) t+=5;
  if(t>55) t=55;
  return `${t} min`;
}

// ================================================================
//  BUILD DAYS
// ================================================================
function buildDays(w){
  const blk=getBlock(w), bw=blockWeek(w), p2=isPhase2(w), dl=DELOAD_WEEKS.has(w);
  const isB=['B','C','D'].includes(blk), isC=['C','D'].includes(blk), isD=blk==='D';

  return {
    monday:{
      name:'MONDAY', tag:'Lower Body + Coil', tagClass:'tag-lower',
      segments:{
        cardio:{label:'CARDIO',color:'cardio',items:[
          {name:'Peloton — Zone 2 Steady Ride', sets:CT(30,bw,blk,p2,dl)},
          {name:'Speed Jump Rope — warm-up', sets:'3 min'},
        ]},
        yoga:{label:'YOGA / STRETCH',color:'yoga',items:[
          {name:'Hip Flexor & Piriformis Flow — Yoga Mat', sets:'8 min'},
          {name:'Thoracic Rotation & Windmill Stretch', sets:'5 min'},
          {name:'Balance Board — Eyes Open Holds', sets:bw>=2?'6 min':'5 min'},
        ]},
        dg:{label:'DISC GOLF — COIL FOCUS',color:'dg',items:[
          {name:'Coil Drill — Resistance Handle Band on Disc', sets:P(3,10,'per side',bw,blk,p2,dl)},
          {name:'X-Step Footwork — Cones + Mini Hurdles', sets:'8 min'},
          {name:'Putting — Basket 15ft Circles', sets:'10 min'},
        ]},
        lift:{label:'LIFT — Lower Body',color:'lift',items:[
          {name:'Zercher Squat — Squat Rack + Barbell + Bumpers', sets:P(4,5,'add plate ea. set',bw,blk,p2,dl)},
          {name:'Zercher Reverse Lunge — Barbell', sets:P(3,8,'per leg',bw,blk,p2,dl)},
          {name:'Romanian Deadlift — Barbell + Std Plates', sets:P(3,8,'',bw,blk,p2,dl)},
          {name:'Landmine Rotation — Slow Coil Focus', sets:P(3,8,'per side',bw,blk,p2,dl)},
          {name:'Bulgarian Split Squat — Dumbbell', sets:P(3,8,'per leg',bw,blk,p2,dl)},
          {name:'Ankle Band Walks — Small Loop Ankle Bands', sets:'3×20 steps fwd/lateral/back'},
          {name:'Farmer Carry — Heavy Dumbbells', sets:dl?'3 trips 40ft light':'4 trips 40ft'},
          {name:'Ab Roller', sets:P(3,10,'',bw,blk,p2,dl)},
          ...(isB?[{name:'Lateral Bounds over Mini Hurdle', sets:P(3,5,'per side',bw,blk,p2,dl)}]:[]),
          ...(isC?[{name:'Nordic Curls — Feet anchored Adjustable Bench', sets:P(3,5,'eccentric focus',bw,blk,p2,dl)}]:[]),
        ]}
      }
    },
    tuesday:{
      name:'TUESDAY', tag:'Upper Body + Lag', tagClass:'tag-upper',
      segments:{
        cardio:{label:'CARDIO',color:'cardio',items:[
          {name:'Punching Bag — Speed Combos + Footwork', sets:CT(25,bw,blk,p2,dl)},
          {name:'Heavy Jump Rope — 2min power intervals', sets:'3 rounds'},
        ]},
        yoga:{label:'YOGA / STRETCH',color:'yoga',items:[
          {name:'Shoulder Capsule Stretch — Yoga Ball assist', sets:'5 min'},
          {name:'Wrist & Forearm Opener — Yoga Mat', sets:'4 min'},
          {name:'Lat + T-Spine Hang — Pull-up Bar', sets:'3×30s dead hang'},
        ]},
        dg:{label:'DISC GOLF — LAG & SNAP',color:'dg',items:[
          {name:'Lag Drills — TechDisc feedback', sets:'10 min focused'},
          {name:'Snap Drills — Handle Bands on Disc', sets:P(3,10,'per side',bw,blk,p2,dl)},
          {name:'Form Throws into Net — Trainer Disc', sets:'10 min'},
        ]},
        lift:{label:'LIFT — Upper Push',color:'lift',items:[
          {name:'Push Press — Squat Rack + Barbell + Bumpers', sets:isB?P(5,3,'max bar speed',bw,blk,p2,dl):P(4,4,'',bw,blk,p2,dl)},
          {name:'Bench Press — Adjustable Bench + Barbell + Plates', sets:P(3,8,'',bw,blk,p2,dl)},
          {name:'Ring Dips — Olympic Rings', sets:P(3,8,'',bw,blk,p2,dl)},
          {name:'Landmine Rotational Press — Explosive', sets:P(3,6,'per side',bw,blk,p2,dl)},
          {name:'Plyo Paralettes — Explosive Push-up', sets:P(3,8,'clap at top',bw,blk,p2,dl)},
          {name:'Banded Punches — Handle Bands', sets:P(3,15,'per side',bw,blk,p2,dl)},
          {name:'Forearm Roller — Wood Dowel + Weighted Dog Leash', sets:'3× full up + down'},
          {name:'Curl Bar — Bicep Curls', sets:P(3,12,'',bw,blk,p2,dl)},
          {name:'Ab Roller', sets:P(3,10,'',bw,blk,p2,dl)},
        ]}
      }
    },
    wednesday:{
      name:'WEDNESDAY', tag:'Recovery + Mobility', tagClass:'tag-recovery',
      segments:{
        cardio:{label:'CARDIO',color:'cardio',items:[
          {name:'Peloton — Easy Recovery Ride', sets:dl?'20 min easy':CT(25,bw,blk,p2,dl)},
        ]},
        yoga:{label:'YOGA / STRETCH',color:'yoga',items:[
          {name:'Full Body Yoga Flow — Yoga Mat', sets:'20 min'},
          {name:'Yoga Ball — Thoracic Extension Hold', sets:'3×45s'},
          {name:'Balance Board — Eyes Closed Holds', sets:bw>=2?'6 min':'5 min'},
          {name:'Ankle Mobility Circles — Small Loop Bands', sets:'2×15 circles per foot'},
        ]},
        dg:{label:'DISC GOLF — PUTTING',color:'dg',items:[
          {name:'Putting Only — Basket Circle 1 & 2', sets:'15 min focused'},
          {name:'TechDisc Grip & Release Feedback', sets:'10 min'},
        ]},
        lift:{label:'LIGHT LIFT — Recovery Focus',color:'lift',items:[
          {name:'Goblet Squat — Kettlebell', sets:dl?'2×12 light':'3×12'},
          {name:'Ring Push-ups — Olympic Rings', sets:dl?'2×10':'3×12'},
          {name:'Back Extensions — Adjustable Bench', sets:dl?'2×12':'3×15'},
          {name:'Band Pull-Aparts — Large Loop Band', sets:'3×20'},
          {name:'Mace 360 — Mace Bell warm weight', sets:'3×12 per direction'},
          {name:'Kettlebell Swings', sets:dl?'2×15':'3×15'},
          {name:'Yoga Ball — Dead Bug Core Hold', sets:'3×30s'},
          {name:'Resistance Band — Face Pulls large loop', sets:'3×20'},
        ]}
      }
    },
    thursday:{
      name:'THURSDAY', tag:'Explosive + Power', tagClass:'tag-explosive',
      segments:{
        cardio:{label:'CARDIO / AGILITY',color:'cardio',items:[
          {name:'Ladder Drills — Speed + Crossover Patterns', sets:CT(12,bw,blk,p2,dl)+' total'},
          {name:'Mini Hurdle — Lateral Hop Overs', sets:'4×8'},
          {name:'Cone Sprints — 5-10-5 Shuttle', sets:'6 rounds'},
        ]},
        yoga:{label:'YOGA / STRETCH',color:'yoga',items:[
          {name:'Dynamic Hip Circles + Leg Swings', sets:'5 min'},
          {name:'Glute & Psoas Release — Yoga Mat', sets:'5 min'},

// ================================================================
//  PROGRESSION BANNER TEXT
// ================================================================
function weekProgNote(w){
  const bw=blockWeek(w), blk=getBlock(w), p2=isPhase2(w), dl=DELOAD_WEEKS.has(w);
  if(dl) return { title:'🟡 DELOAD WEEK — Mandatory Recovery', body:'Cut all lifting sets by 2 and use ~60% weight. No PRs, no grinding. Cardio stays moderate. Mobility gets extra time. Your body gets stronger during rest — skipping deload is the fastest way to stall progress.' };
  const bNotes={A:'BLOCK A FOCUS: Control every rep. Build the motor pattern. Track starting weights — everything progresses from here.',B:'BLOCK B FOCUS: Bar speed is the goal. Move the weight fast. Disc golf emphasis shifts to feeling the whip and lag.',C:'BLOCK C FOCUS: Load the bar. Lower reps, more weight, PRs this block. Translate raw strength to disc spin.',D:'BLOCK D FOCUS: Everything becomes athletic. Lower volume, higher intent. Disc golf gets 70–80% full-power throws.'};
  const wNotes=['','WEEK 1 OF BLOCK — Establish baseline. Learn the movements at these loads. Record every weight used.','WEEK 2 OF BLOCK — Add 1 set to all main lifts. Push slightly past comfort.','WEEK 3 OF BLOCK — Max volume week. Add 2 sets. Go after PRs. This is your peak week.',''];
  return { title:`📈 ${p2?'PHASE 2 — ':''}BLOCK ${blk} — WEEK ${bw}/4`, body:`${wNotes[bw]||''} ${bNotes[blk]}` };
}

// ================================================================
//  STATE
// ================================================================
let currentPhase=0, currentWeek=1;
function getState(){ try{return JSON.parse(localStorage.getItem('dgAthlete_v2')||'{}')}catch(e){return{}} }
function saveState(s){ localStorage.setItem('dgAthlete_v2',JSON.stringify(s)) }

// ================================================================
//  RENDER GRID
// ================================================================
function renderGrid(){
  const state=getState(), grid=document.getElementById('weekGrid');
  grid.innerHTML='';
  const start=currentPhase===0?1:17, end=currentPhase===0?16:32;
  for(let w=start;w<=end;w++){
    const wData=state[`week_${w}`]||{};
    const daysComplete=Object.keys(wData).filter(k=>k.startsWith('day_done_')).length;
    const completed=wData.week_done===true, deload=DELOAD_WEEKS.has(w);
    const btn=document.createElement('div');
    btn.className='week-btn'+(currentWeek===w?' active':'')+(completed?' completed':'')+(deload?' deload':'');
    btn.innerHTML=`<div class="wnum">W${w}</div><div class="wlabel">${deload?'DELOAD':getBlock(w)+blockWeek(w)}</div><div class="prog-bar" style="width:${Math.round((daysComplete/6)*100)}%"></div><div class="check">✓</div>`;
    btn.onclick=()=>{currentWeek=w;renderGrid();renderWeek();};
    grid.appendChild(btn);
  }
  let wDone=0,dDone=0;
  const s=getState();
  for(let i=1;i<=32;i++){const wd=s[`week_${i}`]||{};if(wd.week_done)wDone++;Object.keys(wd).filter(k=>k.startsWith('day_done_')).forEach(()=>dDone++);}
  document.getElementById('weeksDone').textContent=wDone;
  document.getElementById('daysDone').textContent=dDone;
}

// ================================================================
//  RENDER WEEK
// ================================================================
function renderWeek(){
  const w=currentWeek, bl=getBlockLabel(w), days=buildDays(w);
  const state=getState(), wData=state[`week_${w}`]||{}, pn=weekProgNote(w);
  const content=document.getElementById('contentArea');
  content.innerHTML=`
    <div class="week-header">
      <div class="week-title">WEEK <span>${w}</span></div>
      <div class="week-meta"><div class="block-badge ${bl.cls}">${bl.label}</div><div class="week-focus">${bl.sub}</div></div>
    </div>
    <div class="prog-banner ${bl.isDeload?'deload-banner':''}"><strong>${pn.title}</strong>${pn.body}</div>
    <div class="days-grid" id="daysGrid"></div>
    <div class="notes-area">
      <div class="notes-label">Week Notes / PRs / Weights / How You Felt</div>
      <textarea class="notes-input" id="weekNotes" placeholder="e.g. Zercher squat: 185×5. DG felt clean Thursday. HR avg 142 on Peloton. Forearm roller up to 15lbs...">${wData.notes||''}</textarea>
    </div>`;
  const dg=document.getElementById('daysGrid');
  Object.keys(days).forEach(dayKey=>{
    const day=days[dayKey], dayDone=wData[`day_done_${dayKey}`]===true, exStates=wData[`ex_${dayKey}`]||{};
    const card=document.createElement('div');
    card.className='day-card'+(day.isRest?' rest':'');
    let segHtml='';
    Object.keys(day.segments).forEach(segKey=>{
      const seg=day.segments[segKey];
      segHtml+=`<div class="segment"><div class="seg-label"><div class="seg-dot ${seg.color}"></div>${seg.label}</div><ul class="exercise-list">`;
      seg.items.forEach((ex,i)=>{
        const exId=`${dayKey}_${segKey}_${i}`, done=exStates[exId]===true;
        segHtml+=`<li><div class="ex-check ${done?'done':''}" onclick="toggleEx('${w}','${dayKey}','${segKey}',${i},this)">${done?'✓':''}</div><span class="ex-name">${ex.name}</span><span class="ex-sets">${ex.sets}</span></li>`;
      });
      segHtml+=`</ul></div>`;
    });
    card.innerHTML=`<div class="day-header"><div class="day-name">${day.name}</div><div class="day-tag ${day.tagClass}">${day.tag}</div></div><div class="day-body">${segHtml}<button class="day-complete-btn ${dayDone?'done':''}" onclick="toggleDay('${w}','${dayKey}',this)">${dayDone?'✓ DAY COMPLETE':'MARK DAY COMPLETE'}</button></div>`;
    dg.appendChild(card);
  });
  const notesEl=document.getElementById('weekNotes');
  notesEl.addEventListener('input',()=>{const s=getState();if(!s[`week_${w}`])s[`week_${w}`]={};s[`week_${w}`].notes=notesEl.value;saveState(s);});
}

function toggleEx(week,dayKey,segKey,idx,el){
  const s=getState(),wk=`week_${week}`;
  if(!s[wk])s[wk]={};if(!s[wk][`ex_${dayKey}`])s[wk][`ex_${dayKey}`]={};
  const exId=`${dayKey}_${segKey}_${idx}`, wasDone=s[wk][`ex_${dayKey}`][exId]===true;
  s[wk][`ex_${dayKey}`][exId]=!wasDone; saveState(s);
  el.classList.toggle('done',!wasDone); el.textContent=!wasDone?'✓':'';
}
function toggleDay(week,dayKey,btn){
  const s=getState(),wk=`week_${week}`;
  if(!s[wk])s[wk]={};
  const key=`day_done_${dayKey}`, wasDone=s[wk][key]===true;
  s[wk][key]=!wasDone; saveState(s);
  btn.classList.toggle('done',!wasDone);
  btn.textContent=!wasDone?'✓ DAY COMPLETE':'MARK DAY COMPLETE';
  showToast(!wasDone?'🏆 Day logged!':'Day unmarked'); renderGrid();
}
function setPhase(p){
  currentPhase=p; currentWeek=p===0?1:17;
  document.querySelectorAll('.phase-tab').forEach((t,i)=>t.classList.toggle('active',i===p));
  renderGrid(); renderWeek();
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
renderGrid(); renderWeek();
</script>
